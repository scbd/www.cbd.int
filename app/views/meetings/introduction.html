<div>
    <div>
        <h3 ng-show="isLoading" style="color: #777"><i class="fa fa-circle-o-notch fa-spin"></i></h3>
    </div>
    <div class="row" ng-hide="isLoading">
       
        <cbd-article-cover-image ng-if="article.coverImage.url" cover-image="article.coverImage">
            <style>
            .hvr-grow {
                display: inline-block;
                vertical-align: middle;
                transform: translateZ(0);
                box-shadow: 0 0 1px rgba(0, 0, 0, 0);
                backface-visibility: hidden;
                -moz-osx-font-smoothing: grayscale;
                transition-duration: 0.3s;
                transition-property: transform;
            }

            .hvr-grow:hover,
            .hvr-grow:focus,
            .hvr-grow:active {
                transform: scale(1.1);
            }
            </style>
            <a class="btn btn-default pull-right hvr-grow" href ng-click="scrollToDocuments()"
                style="margin: 10px;top: 0px;background: rgba(0, 0, 0, .7);color: #fff;position: absolute;"
             ng-if="article.coverImage && hasDocumentTabs">
                <i class="fa fa-file"></i> View Documents
            </a>
        </cbd-article-cover-image>

        <div class="col-lg-8 col-md-12 col-md-12 col-sm-12 col-xs-12" style="margin-top:5px;" id="intro-article">
            <span ng-if="meeting.uploadStatement" class="pull-right" style="margin:5px;">
                <upload-statement-button ng-vue="vueOptions" :route="uploadRoute" />
            </span>
            <a  class="btn btn-default pull-right hvr-grow" href ng-click="scrollToDocuments()"
             style="margin:5px;background: rgba(0, 0, 0, .7);color: #fff;"
             ng-if="!article.coverImage && hasDocumentTabs">
                <i class="fa fa-file"></i> View Documents
            </a>
            <cbd-article ng-vue ng-vue-expose="&onArticleLoad" :query="articleQuery" v-if="articleQuery" :admin-tags="articleAdminTags" 
            @load="onArticleLoad($event)" hide-cover-image="true" show-edit="true"></cbd-article>
        </div>        
        <div class="col-lg-4 col-md-12 col-sm-12 col-xs-12 order-2 order-lg-1" style="padding-top:15px;" ng-if="article">
            <social-media></social-media>
        </div>
        <div class="col-12 order-1 order-lg-2" id="documents" ng-if="meeting && showDocuments" view-injector="{ module: 'views/meetings/documents/documents', resolve: { showMeeting: resolveLiteral(false), hideEmptyControls: resolveLiteral(true) } }"></div>
    </div>
</div>
