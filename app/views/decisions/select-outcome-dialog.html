<div class="modal-content">
    <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="closeThisDialog()">
            <span aria-hidden="true">&times;</span>
        </button>
        <h4 class="modal-title">Add an outcome</h4>
    </div>
    <div class="modal-body">
        <form name="form" ng-submit="save()" novalidate>

            <div class="form-group">
                <label for="symbol">Meeting, document or notification symbol, or a URL</label>
                <input type="text" class="form-control" id="symbol" name="symbol" ng-model="symbol"
                    ng-model-options="{ debounce : { 'default': 300, 'blur': 0 } }">
                <span class="help-block" ng-if="type">Detected: {{type}}</span>
            </div>

            <button type="submit" class="hidden"></button>

        </form>

        <div ng-if="code">
            <!-- ng-repeat rebuilds the preview on every code change: the display directives look up once, on link -->
            <div class="card" ng-repeat="previewCode in [code] track by previewCode">
                <div class="card-body" style="padding:12px;font-size:0.9em">
                    <div ng-switch="type">
                        <div ng-switch-when="notification">
                            <decision-notification symbol="previewCode"></decision-notification>
                        </div>
                        <div ng-switch-when="document">
                            <decision-meeting-document symbol="previewCode"></decision-meeting-document>
                        </div>
                        <div ng-switch-default>
                            <decision-meeting symbol="previewCode"></decision-meeting>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" aria-label="Close" ng-click="closeThisDialog()">Cancel</button>
        <button type="button" class="btn btn-primary" aria-label="Save" ng-click="save()" ng-disabled="!code">Next
            »</button>
    </div>
</div>
